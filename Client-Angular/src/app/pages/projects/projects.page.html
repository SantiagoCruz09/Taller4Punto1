@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Proyectos..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Proyectos" ></app-alert>
    }

    @case('success'){
        <app-projects-table [projects]="projects" ></app-projects-table>
    }

}
